[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shotproof"
version = "0.1.0"
description = "Record a screen interaction on macOS, encode it to a GIF, and check the GIF against explicit limits."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0"]
keywords = ["gif", "screen-recording", "screenshot", "ci", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/vipul21435/shotproof"

[project.optional-dependencies]
encode = ["imageio-ffmpeg>=0.4.9"]
dev = ["pytest>=7", "imageio-ffmpeg>=0.4.9"]

[project.scripts]
shotproof = "shotproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
